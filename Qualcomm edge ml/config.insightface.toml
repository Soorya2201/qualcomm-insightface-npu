# InsightFace w600k_r50 on the Snapdragon X Elite NPU.
#
# Committed on purpose: config.toml is gitignored, so without this file a fresh
# clone has nothing that describes how the compiled model must be fed. Every
# value under [models.embedder] is part of the model's contract -- a wrong one
# does not raise, it produces plausible-looking embeddings that match the wrong
# people. Validate with: python scripts/preflight_insightface.py --config config.insightface.toml

# Phone camera over MJPEG (DroidCam/IP Webcam). Frames are decoded in the
# browser and posted to the local service as raw pixels; only JSON leaves this
# machine, and only to the Uno Q status light.
[[cameras]]
id = "camera-1"
source = "mjpeg"
url = "http://10.36.254.185:4747/video"

[[cameras]]
id = "camera-2"
source = "webcam"

[web]
host = "127.0.0.1"          # must stay local: this endpoint receives raw camera pixels
port = 8765
frame_width = 640
frame_height = 480
frame_interval_ms = 300
open_browser = true

[models.detector]
model_id = "yolov5_face"
path = "models/yolov5n-face-onnx-float/yolov5n_face.onnx"
score_threshold = 0.50
nms_iou_threshold = 0.50

[models.embedder]
model_id = "insightface_w600k_r50"
# The 333-byte EPContext wrapper; model.bin must sit beside it, under that name.
path = "../models/compiled/w600k_r50_qnn_x_elite/w600k_r50_qnn.onnx"
embedding_dimension = 512
input_width = 112
input_height = 112
channel_order = "bgr"        # InsightFace trained on BGR, not RGB
image_mean = [0.5, 0.5, 0.5] # with the /255 in vision.py this is (x-127.5)/127.5
image_std  = [0.5, 0.5, 0.5]
align_landmarks = true       # 5-point ArcFace warp; a plain crop degrades accuracy badly

[database]
# Name carries the model id: CavaFace embeddings are ALSO 512-d, so the
# dimension check cannot detect a stale database from a different embedder.
embeddings_path = "data/allowed_embeddings_insightface_w600k_r50.json"
cosine_threshold = 0.36      # buffalo_l starting point -- CALIBRATE on your own pairs

[enrollment]
minimum_images_per_person = 3

[runtime]
provider = "QNNExecutionProvider"
backend_path = "auto"
performance_mode = "burst"
require_npu = true           # fail loudly rather than silently running on CPU
context_cache = false

[processing]
alert_cooldown_seconds = 5.0
decision_mode = "any_allowed"
min_face_size = 50           # below ~50px an upscaled crop is mostly interpolation

[board]
# Arduino Uno Q status light + buzzer. Reached over ssh via mDNS; see the
# uno-q-board submodule. Disabled automatically if that tooling is absent.
enabled = true
scripts_dir = "../uno-q-board/scripts"
heartbeat_seconds = 30.0
min_interval_seconds = 0.5
