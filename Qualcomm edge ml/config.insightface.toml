# InsightFace w600k_r50 on the Snapdragon X Elite NPU.
#
# Committed on purpose: config.toml is gitignored, so without this file a fresh
# clone has nothing that describes how the compiled model must be fed. Every
# value under [models.embedder] is part of the model's contract -- a wrong one
# does not raise, it produces plausible-looking embeddings that match the wrong
# people. Validate with: python scripts/preflight_insightface.py --config config.insightface.toml

# Phone camera over MJPEG (DroidCam/IP Webcam). Frames are decoded in the
# browser and posted to the local service as raw pixels; only JSON leaves this
# machine, and only to the Uno Q status light.
[[cameras]]
id = "camera-1"
source = "mjpeg"
url = "http://10.36.254.185:4747/video"

[[cameras]]
id = "camera-2"
source = "webcam"

[web]
host = "127.0.0.1"          # must stay local: this endpoint receives raw camera pixels
port = 8765
frame_width = 640
frame_height = 480
frame_interval_ms = 300
open_browser = true

[models.detector]
model_id = "yolov5_face"
path = "models/yolov5n-face-onnx-float/yolov5n_face.onnx"
score_threshold = 0.50
nms_iou_threshold = 0.50

[models.embedder]
model_id = "insightface_w600k_r50"
# The 333-byte EPContext wrapper; model.bin must sit beside it, under that name.
path = "../models/compiled/w600k_r50_qnn_x_elite/w600k_r50_qnn.onnx"
embedding_dimension = 512
input_width = 112
input_height = 112
channel_order = "bgr"        # InsightFace trained on BGR, not RGB
image_mean = [0.5, 0.5, 0.5] # with the /255 in vision.py this is (x-127.5)/127.5
image_std  = [0.5, 0.5, 0.5]
align_landmarks = true       # 5-point ArcFace warp; a plain crop degrades accuracy badly

[database]
# Name carries the model id: CavaFace embeddings are ALSO 512-d, so the
# dimension check cannot detect a stale database from a different embedder.
embeddings_path = "data/allowed_embeddings_insightface_w600k_r50.json"
cosine_threshold = 0.36      # buffalo_l starting point -- CALIBRATE on your own pairs

[enrollment]
minimum_images_per_person = 3

[runtime]
provider = "QNNExecutionProvider"
backend_path = "auto"
performance_mode = "burst"
require_npu = true           # fail loudly rather than silently running on CPU
context_cache = false

[processing]
alert_cooldown_seconds = 5.0
decision_mode = "any_allowed"
min_face_size = 50           # below ~50px an upscaled crop is mostly interpolation

[board]
# Arduino Uno Q status light + buzzer.
#
# transport = "http": the board runs uno-q-listener/verdict_server.py, joins
# Wi-Fi itself and drives its own lights. Nothing sits in between -- no laptop
# holding a USB cable, no ssh session. This is the self-sufficient setup.
#
# transport = "ssh": legacy push through the uno-q-board submodule's
# send_to_board.py, for when the board is a peripheral of some host machine.
enabled = true

# "ntfy": both sides make OUTBOUND https connections only, never to each
# other -- proven on real hardware over a venue network with client
# isolation (the router actively refused direct traffic between the two
# devices; this sidesteps that entirely). Needs real outbound internet on
# both devices; does not fix a captive portal blocking that internet access.
# "http": board runs uno-q-listener/verdict_server.py and is reached directly
# -- simpler, but requires the two devices to be able to reach each other.
# "ssh": legacy push through the uno-q-board submodule's send_to_board.py.
transport = "ntfy"

# NEVER put a real topic or token here if this file is committed to a public
# repo: anyone who reads it could drive the board's real lights and buzzer.
# Both are read from the environment first, so the real values stay off disk
# entirely -- export them in the shell that runs the app:
#   export NTFY_TOPIC=your-long-random-topic
#   export VERDICT_TOKEN=your-shared-secret   # only used by transport="http"
ntfy_topic = ""
ntfy_base_url = "https://ntfy.sh"
url = "http://SCL-UNOQ05.local:8770"
token = ""
scripts_dir = "../uno-q-board/scripts"
# Heartbeat: the current state is re-sent at most once per min_interval_seconds
# while frames keep arriving, as live proof the relay is flowing. Changes
# (someone appears, leaves, or flips authorized/unauthorized) are queued and
# delivered in order ahead of heartbeats; a failed change is retried.
min_interval_seconds = 1.0
max_queue = 100

# ntfy only. Public ntfy.sh limits each client IP two ways, both HTTP 429:
#   * request rate: burst of ~60, then one every 5 s (measured: at one publish
#     per second, 81 succeeded, then 3 in 4 were refused). The budget below
#     stays under it; heartbeats may not spend the last ntfy_budget_reserve
#     tokens, so a change still goes out immediately.
#   * DAILY MESSAGE QUOTA: 250 per IP (documented, and hit during testing).
#     At a one-second heartbeat this lasts roughly 17 minutes, after which the
#     board receives nothing -- changes included -- until it resets. The
#     notifier logs that at ERROR and pauses for ntfy_quota_backoff_seconds.
#     For a long-running demo use transport = "http" (no quota) or a paid tier.
ntfy_budget_burst = 50
ntfy_budget_refill_seconds = 5.0
ntfy_budget_reserve = 10
ntfy_quota_backoff_seconds = 600.0

[vlm]
# GenieX vision-language description of unauthorized faces: outfit color,
# glasses, hat. Disabled by default -- absent GenieX tooling is not an error,
# it just means no descriptions. Run scripts/ensure_vlm_model.py first if
# enabling this; see src/access_vision/vlm.py's module docstring for why
# Qwen2.5-VL-7B-Instruct / w4a16 (Qualcomm does not publish an int8/w8a8
# bundle for this model -- w4a16 is smaller and faster on the NPU anyway,
# not a fallback), and why this triggers only on "unauthorized", never on
# every frame, so it never competes with the detector/embedder for the NPU
# the way a per-frame VLM call would.
enabled = false
base_url = "http://127.0.0.1:18181/v1"   # GenieX's local OpenAI-compatible server
model = "Qwen2.5-VL-7B-Instruct"
trigger_on = "unauthorized"              # or "allowed", never both/every-frame
crop_expand = 1.0                        # fraction of the face box added on every side
cooldown_seconds = 10.0                  # minimum gap between VLM calls, across all people
max_tokens = 64
timeout_seconds = 30.0
max_queue = 4
