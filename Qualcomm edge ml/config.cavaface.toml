[[cameras]]
id = "camera-1"
source = "webcam"

[[cameras]]
id = "camera-2"
source = "mjpeg"
url = "http://10.36.254.185:4747/video"

[web]
host = "127.0.0.1"
port = 8765
frame_width = 640
frame_height = 480
frame_interval_ms = 25.0
open_browser = true

[models.detector]
model_id = "yolov5_face"
path = "models/yolov5n-face-onnx-float/yolov5n_face.onnx"
score_threshold = 0.50
nms_iou_threshold = 0.50

[models.embedder]
model_id = "cavaface"
path = "models/cavaface-onnx-float/cavaface-onnx-float/cavaface.onnx"
embedding_dimension = 512

[database]
embeddings_path = "data/allowed_embeddings.json"
cosine_threshold = 0.30

[enrollment]
minimum_images_per_person = 3

[runtime]
provider = "QNNExecutionProvider"
backend_path = "auto"
performance_mode = "burst"
require_npu = true
context_cache = false

[processing]
alert_cooldown_seconds = 5.0
decision_mode = "any_allowed"
min_face_size = 32
log_interval_seconds = 5.0
