# InsightFace w600k_r50 on the Snapdragon X Elite NPU.
#
# Committed on purpose: config.toml may be local-only in downstream repos, so
# this file records how the compiled model must be fed. Every value under
# [models.embedder] is part of the model's contract. A wrong value can produce
# plausible-looking embeddings that match the wrong people.

[[cameras]]
id = "camera-1"
source = "webcam"

[[cameras]]
id = "camera-2"
source = "mjpeg"
url = "http://10.36.254.185:4747/video"

[web]
host = "127.0.0.1"
port = 8765
frame_width = 640
frame_height = 480
frame_interval_ms = 25.0
open_browser = true

[models.detector]
model_id = "yolov5_face"
path = "models/yolov5n-face-onnx-float/yolov5n_face.onnx"
score_threshold = 0.50
nms_iou_threshold = 0.50

[models.embedder]
model_id = "insightface_w600k_r50"
# The 333-byte EPContext wrapper; model.bin must sit beside it, under that name.
path = "models/compiled/w600k_r50_qnn_x_elite/w600k_r50_qnn.onnx"
embedding_dimension = 512
input_width = 112
input_height = 112
output_name = "output_0"
channel_order = "bgr"
image_mean = [0.5, 0.5, 0.5]
image_std = [0.5, 0.5, 0.5]
align_landmarks = true

[database]
# Name carries the model id: CavaFace embeddings are also 512-d, so the
# dimension check cannot detect a stale database from a different embedder.
embeddings_path = "data/allowed_embeddings_insightface_w600k_r50.json"
cosine_threshold = 0.36

[enrollment]
minimum_images_per_person = 3

[runtime]
provider = "QNNExecutionProvider"
backend_path = "auto"
performance_mode = "burst"
require_npu = true
context_cache = false

[processing]
alert_cooldown_seconds = 5.0
decision_mode = "any_allowed"
min_face_size = 50
log_interval_seconds = 5.0

[board]
# Arduino Uno Q status light + buzzer.
enabled = true
transport = "ntfy"
ntfy_topic = ""
ntfy_base_url = "https://ntfy.sh"
url = "http://SCL-UNOQ05.local:8770"
token = ""
scripts_dir = "uno-q-board/scripts"
heartbeat_seconds = 30.0
min_interval_seconds = 1.0
